version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: stg_payments
    columns:
      - name: payment_id
        tests:
          - unique
          - not_null
      - name: payment_method
        tests:
          - accepted_values:
              values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']

      - name: exceptions
        assertions:

          __is_positive__:
            - amount

          __is_in__:
            payment_method: 'coupon'

          PAYMENT_METHOD_is_BANK_TRANSFER:
            description: 'PAYMENT_METHOD is equal to "BANK_TRANSFER".'
            expression: PAYMENT_METHOD = 'BANK_TRANSFER'